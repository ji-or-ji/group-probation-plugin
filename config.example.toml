[plugin]
enabled = true
config_version = "1.0.0"
# 「麦麦看到你了！」插件的 config.toml 完整路径（可选）；留空自动在插件目录同级查找
# sibling_awareness_config = ""

[probation]
enabled = true
# 启用考察期的群号白名单（群号，字符串）。仅列出的群会登记/考察/移出新人。
# 空数组 = 不作用于任何群（全局停用，安全默认）。必填，否则考察期不生效。
enabled_groups = []
probation_hours = 48
check_interval_minutes = 30
reject_add_request = false
whitelist = []

[probation.greet]
mode = "template"
fallback_to_template = true
template = "欢迎新朋友加入～出来冒个泡认识一下？"

[probation.kick_message]
mode = "template"
fallback_to_template = true
template = "成员 {member_name}（QQ {user_id}）加入超过 {probation_hours} 小时未发言，已移出群聊。"

[probation.llm]
model = "planner"
temperature = 0.8
max_tokens = 128